[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lite-omnijev"
version = "0.1.0"
description = "Reproducible lightweight multimodal decision model engineering"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.21,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
training = [
  "torch>=2.6,<3",
  "transformers>=5.5,<6",
  "peft>=0.18,<1",
  "accelerate>=1.5,<2",
  "safetensors>=0.5,<1",
]
monitoring = [
  "swanlab>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "playwright>=1.51,<2"]

[tool.hatch.build.targets.wheel]
packages = ["data", "train", "eval", "serve", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

# This archived diagnostic is immutable evidence: its SHA is recorded in its report.
[tool.ruff.format]
exclude = ["reports/teacher-preflight-cpu-002.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ['^\.worktrees/', '^\.venv/']
