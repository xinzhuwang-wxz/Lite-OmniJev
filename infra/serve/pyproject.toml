[project]
name = "lite-omnijev-service-env"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "vllm[audio]==0.26.0",
  "av==15.1.0",
  "soundfile==0.13.1",
  "transformers==5.13.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
