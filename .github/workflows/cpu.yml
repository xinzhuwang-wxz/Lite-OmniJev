name: CPU contracts
on:
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: make check
      - run: make smoke
# Explicit dispatch only during bootstrap to avoid recurring remote jobs.
# This CPU job does not substitute for HF/vLLM parity or GPU training gates.
