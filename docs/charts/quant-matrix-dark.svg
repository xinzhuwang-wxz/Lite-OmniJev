<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans CJK SC,sans-serif"><title>可下载工件：大小与验证范围</title>
<rect x="0" y="0" width="880" height="440" rx="0" fill="#141923"/>
<text x="32" y="44" fill="#f4f7fc" font-size="24" font-weight="700">可下载工件：大小与验证范围</text>
<text x="32" y="72" fill="#b1bfd3" font-size="14" font-weight="400">GB = 1,000,000,000 字节 · 文件大小不等于运行时峰值内存</text>
<text x="32" y="136" fill="#f4f7fc" font-size="15" font-weight="400">GGUF F16</text>
<rect x="205" y="119" width="442.18473636" height="22" rx="5" fill="#79acff"/>
<text x="712" y="136" fill="#f4f7fc" font-size="17" font-weight="600">15.05 GB</text>
<text x="32" y="192" fill="#f4f7fc" font-size="15" font-weight="400">GGUF Q8_0</text>
<rect x="205" y="175" width="235.91775396000003" height="22" rx="5" fill="#79acff"/>
<text x="712" y="192" fill="#f4f7fc" font-size="17" font-weight="600">8.03 GB</text>
<text x="32" y="248" fill="#f4f7fc" font-size="15" font-weight="400">GGUF Q4_K_M</text>
<rect x="205" y="231" width="156.72421283999998" height="22" rx="5" fill="#79acff"/>
<text x="712" y="248" fill="#f4f7fc" font-size="17" font-weight="600">5.34 GB</text>
<text x="32" y="304" fill="#f4f7fc" font-size="15" font-weight="400">MLX 4bit</text>
<rect x="205" y="287" width="193.82179235750002" height="22" rx="5" fill="#64d4b3"/>
<text x="712" y="304" fill="#f4f7fc" font-size="17" font-weight="600">6.60 GB</text>
<text x="32" y="352" fill="#b1bfd3" font-size="13" font-weight="400">GGUF：三格式文本选答 20/20；截图 / 音频 / 视频为生成冒烟，退出码 0。</text>
<text x="32" y="377" fill="#b1bfd3" font-size="13" font-weight="400">MLX：仅完成转换，尚无 Apple Silicon 推理验收；不代表概率 / ECE 门通过。</text>
<text x="32" y="409" fill="#b1bfd3" font-size="12" font-weight="400">GGUF 仅主模型，另需 0.99 GB mmproj；MLX 为目录文件合计。来源：发布完整性回执。</text>
</svg>
