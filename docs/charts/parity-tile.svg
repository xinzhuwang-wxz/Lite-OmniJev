<text x="32" y="386" fill="#52647c" font-size="14" font-weight="400">不推断量化格式、校准迁移或生产性能。</text>
<text x="32" y="414" fill="#52647c" font-size="12" font-weight="400">来源：s6-serving-compare-final-bound-002.json · s6-serving-hf-reference-final-001.json</text>
