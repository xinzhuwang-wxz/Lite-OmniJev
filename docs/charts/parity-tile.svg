<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans CJK SC,sans-serif"><title>同一发布权重，核验两个运行时</title>
<rect x="0" y="0" width="880" height="440" rx="0" fill="#f7f9fc"/>
<text x="32" y="44" fill="#18253b" font-size="24" font-weight="700">同一发布权重，核验两个运行时</text>
<text x="32" y="72" fill="#52647c" font-size="14" font-weight="400">Transformers HF 参考 ↔ vLLM · FP32 融合工件 · 来源哈希绑定</text>
<rect x="32" y="105" width="816" height="210" rx="8" fill="#ffffff"/>
