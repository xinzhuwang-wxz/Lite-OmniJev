<text x="58" y="228" fill="#2864ca" font-size="58" font-weight="700">5.75 × 10⁻⁶</text>
<text x="550" y="156" fill="#18253b" font-size="24" font-weight="600">100 个公开案例</text>
<text x="550" y="202" fill="#18253b" font-size="20" font-weight="400">每个运行时各跑两遍</text>
